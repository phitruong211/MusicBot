services:
  # Giải chữ ký link YouTube thay cho Lavalink (plugin tự giải đang lỗi "Must find sig function").
  cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      - OVERRIDE_PLAYER_VARIANT=IAS
      - OVERRIDE_SCRIPT_VARIANT=IAS
    expose:
      - "8001" # chỉ mạng nội bộ Docker

  # Lấy token ẩn danh của Spotify để đọc playlist (app Spotify mới không đọc được playlist bằng client credentials).
  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    restart: unless-stopped
    expose:
      - "8080" # chỉ mạng nội bộ Docker

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    depends_on:
      - cipher
      - spotify-tokener
    environment:
      - _JAVA_OPTIONS=-Xmx384m
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_COUNTRY=${SPOTIFY_COUNTRY:-VN}
      - YT_OAUTH_ENABLED=${YT_OAUTH_ENABLED:-false}
      - YT_REFRESH_TOKEN=${YT_REFRESH_TOKEN:-}
      - YT_OAUTH_SKIP_INIT=${YT_OAUTH_SKIP_INIT:-false}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - "2333" # chỉ mạng nội bộ Docker, không mở ra ngoài

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file: .env
    environment:
      - LAVALINK_HOST=lavalink
    volumes:
      - ./data:/app/data
