server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Snapshot có bản sửa TV client ("The page needs to be reloaded"), chưa có trong release 1.18.2.
    # Khi có release mới hơn 1.18.2 thì đổi lại về bản release và snapshot: false.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false # đã thay bằng youtube-plugin
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 1000 # chịu được khoảng khựng GC/CPU bận lâu hơn (mặc định 400)
    frameBufferDurationMs: 5000
    # Đặt cho cả node. Từ Discord chọn Opus 5/10 trong /settings: docker-compose chạy hai node (lavalink = 5, lavalink-hq = 10). 10/HIGH tốn CPU nhất.
    opusEncodingQuality: ${LAVALINK_OPUS_QUALITY:5}
    resamplingQuality: ${LAVALINK_RESAMPLING:MEDIUM}
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    remoteCipher:
      url: "http://cipher:8001"
      userAgent: "musicbot"
    # Danh sách client có thể thay đổi theo từng bản youtube-source,
    # xem README của plugin nếu thấy lỗi "client not found".
    clients:
      - MUSIC
      - TV # client duy nhất dùng được OAuth, cần đăng nhập (YT_OAUTH_ENABLED=true)
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TVHTML5_SIMPLY
    oauth:
      enabled: ${YT_OAUTH_ENABLED:false}
      refreshToken: "${YT_REFRESH_TOKEN:}"
      skipInitialization: ${YT_OAUTH_SKIP_INIT:false}

  lavasrc:
    # Spotify không phát audio: tìm bản tương ứng trên YouTube theo ISRC rồi theo tên.
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "${SPOTIFY_COUNTRY:VN}"
      customTokenEndpoint: "http://spotify-tokener:8080/api/token"
      preferPartnerApi: true # đọc playlist/album bằng token ẩn danh (API chính thức trả 401 với app mới)
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: false # /v1/artists trả 403 với app Spotify mới

logging:
  level:
    root: INFO
    lavalink: INFO
